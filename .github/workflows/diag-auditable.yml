name: diag-auditable
on:
  push:
    branches: [claude/project-thread-6qduot]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just,cargo-auditable@0.7.7
      - run: choco install nasm ninja --no-progress -y
      - run: cargo install rust-audit-info --locked
      - name: just dist, verbose
        env:
          CARGO_TERM_VERBOSE: 'true'
        run: |
          $env:PATH = "C:\Program Files\NASM;$env:PATH"
          just dist *> "$env:RUNNER_TEMP\dist.log"
          Write-Output "exit $LASTEXITCODE"
      - name: what was linked
        if: always()
        shell: bash
        run: |
          grep -n "Running .*--crate-name smeltr .*--crate-type bin" "$RUNNER_TEMP/dist.log" | head -2 | cut -c1-600
          grep -o "link-arg=[^ ']*audit[^ ']*\|/INCLUDE:[A-Z_]*" "$RUNNER_TEMP/dist.log" | sort | uniq -c
          grep -n -i "cargo-auditable\|WARNING" "$RUNNER_TEMP/dist.log" | head -20
          ls -la target/dist/deps/*audit* || true
          rust-audit-info target/dist/smeltr.exe | head -c 300; echo
          tail -5 "$RUNNER_TEMP/dist.log"
      - name: sections
        if: always()
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse "$vs\VC\Tools\MSVC" -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          & $dumpbin.FullName /headers target/dist/smeltr.exe | Select-String 'name|SECTION HEADER'
          Get-ChildItem target/dist/deps -Filter '*audit*' | ForEach-Object { & $dumpbin.FullName /headers /symbols $_.FullName | Select-String 'dep-v0|AUDITABLE|flags' }
