name: diag-auditable
on:
  push:
    branches: [claude/project-thread-6qduot]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        flags: ['-W linker_messages -C link-arg=/VERBOSE:REF', '-C lto=off -W linker_messages']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just,cargo-auditable@0.7.7
      - run: choco install nasm ninja --no-progress -y
      - run: just frontends
      - name: build
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\NASM;$env:PATH"
          cargo auditable rustc --locked --profile dist --bin smeltr -- ${{ matrix.flags }} *> "$env:RUNNER_TEMP\build.log"
          Write-Output "exit $LASTEXITCODE"
      - name: look
        if: always()
        shell: bash
        run: |
          set +e
          L="$RUNNER_TEMP/build.log"
          wc -l "$L"
          grep -n -i "audit\|dep-v0\|LNK\|warning" "$L" | grep -v "Discarded\|^\s*$" | cut -c1-400 | head -60
          find target -iname '*audit_data*' | head
          tail -5 "$L"
          python -c "
          import struct,sys
          f=open('target/dist/smeltr.exe','rb').read()
          pe=struct.unpack_from('<I',f,0x3c)[0];n=struct.unpack_from('<H',f,pe+6)[0];o=struct.unpack_from('<H',f,pe+20)[0];s=pe+24+o
          print([f[s+i*40:s+i*40+8].rstrip(b'\0') for i in range(n)])
          "
