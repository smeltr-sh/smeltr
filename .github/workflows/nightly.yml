# Every check on main, at night, when main or stable Rust has moved since the last finished run: the live services,
# the whole of the GUI specs, every fuzzer, Kerberos, Windows and Linux on arm64. Sunday's run goes ahead whatever
# moved, for what changes outside the repository: advisories, npm audit, and new ECS and OCSF releases. A newer run
# cancels an older one.
name: Nightly

on:
  schedule:
    # 07:00 UTC, the small hours in America.
    - cron: '0 7 * * 1-6'
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  WEEKLY: '0 7 * * 0'

jobs:
  moved:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.moved.outputs.run }}
    steps:
      - id: moved
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$SCHEDULE" = "$WEEKLY" ]; then
            echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A cancelled run checked nothing, so only a run that passed or failed counts.
          read -r last day < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --limit 20 \
            --json headSha,conclusion,createdAt \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0] | "\(.headSha) \(.createdAt[:10])"')
          # A new stable invalidates the cached build, and only this run saves another.
          stable=$(curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml | sed -n 's/^date = "\(.*\)"$/\1/p')
          echo "last finished run: ${last:-none} on ${day:-never}; stable of ${stable:-unknown}"
          if [ "$last" = "$GITHUB_SHA" ] && [[ "$stable" < "$day" ]]; then echo run=false; else echo run=true; fi >> "$GITHUB_OUTPUT"

  # `check-live` in two: `check-all` here, and the live tests on a runner of their own, so neither's timeouts
  # suffer the other's load.
  all:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'true'
      - run: just check-all
      - run: just build-benches

  # Every live test, against `tests/live/compose.live.yaml`.
  live:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'true'
      - run: just live-tests

  gui:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm --prefix tests/gui ci && npx --prefix tests/gui playwright install --with-deps chromium
      - run: just check-gui
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-report
          path: tests/gui/report
          retention-days: 14

  # The crate's offline fuzzers, then the GUI's.
  fuzz:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm --prefix tests/gui ci && npx --prefix tests/gui playwright install --with-deps chromium
      - run: just check-fuzz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-report
          path: tests/gui/report
          retention-days: 14

  kerberos:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The KDC and its tools; the runner has the JRE the broker needs.
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y krb5-kdc krb5-admin-server krb5-user
      - run: just check-kerberos

  # The crate's checks on each other platform a release is built for. Windows checks out with CRLF line endings, as a
  # Windows clone does.
  platforms:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'true'
      - run: just check-rust

  # The cache the jobs above saved, against GitHub's 10 GB a repository holds before it evicts the least recently
  # used. A warning, not a failure: a cache evicted costs one cold build, not a check.
  cache:
    needs: [moved, all, live, platforms]
    if: ${{ !cancelled() && needs.moved.outputs.run == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --json key,ref,sizeInBytes,lastAccessedAt \
            --jq '.[] | "\(.sizeInBytes / 1e9 * 100 | round / 100) GB  \(.ref)  \(.key)  last used \(.lastAccessedAt)"'
          used=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes)
          echo "In use: $((used / 1000000)) MB of 10 GB"
          if [ "$used" -gt 8000000000 ]; then
            echo "::warning title=Cache nearly full::$((used / 1000000)) MB of 10 GB in use; past 10 GB GitHub evicts the least recently used"
          fi

  # What can fail with nothing changed here: a new release of ECS or OCSF, or an npm advisory. `check-all` runs
  # cargo deny's advisories.
  upstream:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: just schemas-latest
      - if: ${{ !cancelled() }}
        run: |
          status=0
          for dir in gui-frontend website tests/gui; do npm --prefix "$dir" audit || status=1; done
          exit $status
