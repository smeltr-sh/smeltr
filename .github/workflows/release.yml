# A pushed release tag (`v1.2.0`) builds that commit's release archives and image, and publishes them as its
# Release. `just cut-release` makes the tag; nothing here records, commits or tags. A
# pre-release tag (`v1.2.0-rc1`) is a trial, run by hand on its tag from the Actions tab or with
# `gh workflow run release.yml --ref v1.2.0-rc1 -f windows=false`: it needs no fixtures, drafts a pre-release,
# and pushes only its own image tags. Without Windows, the image is out as soon as Linux is built.
#
# `just check` does not run here: it runs before every push. Actions are
# pinned to commits, and the jobs that run the build hold no token that can publish.
name: Release

on:
  push:
    tags: ['v*', '!v*-*']
  workflow_dispatch:
    inputs:
      windows:
        description: Build Windows too
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The Dockerfile copies `.git` into its builder, which must not carry the token.
          persist-credentials: false
      - name: The tag is semver, on main or its line's release branch and alone on its commit, and a release carries its fixtures and notes
        env:
          WINDOWS: ${{ github.event_name == 'push' || inputs.windows }}
        run: |
          test "$GITHUB_REF_TYPE" = tag \
            || { echo "::error::run the release on a v* tag, not on a branch"; exit 1; }
          name=${GITHUB_REF_NAME#v}
          [[ "$name" =~ ^([0-9]+\.[0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::$GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<pre-release>]"; exit 1; }
          line=${BASH_REMATCH[1]}
          git merge-base --is-ancestor HEAD origin/main \
            || { git rev-parse -q --verify "origin/release/$line" >/dev/null \
              && git merge-base --is-ancestor HEAD "origin/release/$line"; } \
            || { echo "::error::$GITHUB_REF_NAME is on neither main nor release/$line"; exit 1; }
          # The build, dist and this workflow each read the release name off the commit; two tags make it ambiguous.
          test "$(git tag --points-at HEAD --list 'v[0-9]*' | wc -l)" -eq 1 \
            || { echo "::error::more than one v* tag on this commit: delete the stale one"; exit 1; }
          case "$name" in *-*) exit 0 ;; esac
          test "$WINDOWS" = true \
            || { echo "::error::a release carries Windows: only a pre-release can leave it out"; exit 1; }
          test -d "tests/fixtures/releases/$name" \
            || { echo "::error::no tests/fixtures/releases/$name: cut a release with just cut-release"; exit 1; }
          node website/scripts/release-notes.js "$name" > /dev/null \
            || { echo "::error::no dated notes for $name in website/src/lib/releases.json"; exit 1; }

  linux:
    needs: guard
    # Each architecture builds on its own: the vendored C configures by running what it compiled.
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: ''
          - runner: ubuntu-26.04-arm
            arch: -arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The Dockerfile copies `.git` into its builder, which must not carry the token.
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just,cargo-nextest@0.9.146
      - run: just dist
      - name: Run the integration tests in the image
        # The KDC and its tools the Kerberos tests sign in with; the runner has the JRE and openssl the brokers need.
        run: |
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y krb5-kdc krb5-admin-server krb5-user
          just image-tests
      - name: Scan the image against the STIG
        run: just stig && mv stig/report.html smeltr-stig-linux${{ matrix.arch }}.html
      - name: Scan the image for known vulnerabilities
        run: just cves && mv cves/report.txt smeltr-cves-linux${{ matrix.arch }}.txt
      - name: List the image's packages as an SBOM
        run: just sbom && mv sbom/sbom.cdx.json smeltr-sbom-linux${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux${{ matrix.arch }}
          path: |
            smeltr-stig-linux${{ matrix.arch }}.html
            smeltr-cves-linux${{ matrix.arch }}.txt
            smeltr-sbom-linux${{ matrix.arch }}.cdx.json
            smeltr-linux${{ matrix.arch }}.tar.gz
            smeltr-image-linux${{ matrix.arch }}.tar.gz

  windows:
    needs: guard
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The Dockerfile copies `.git` into its builder, which must not carry the token.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          # cargo-auditable: the same crate record the Dockerfile writes into the Linux binary.
          tool: just,cargo-auditable@0.7.8
      # AWS-LC's FIPS build wants NASM and Ninja on Windows; the runner has cmake, Go and perl.
      - run: choco install nasm ninja --no-progress -y
      # ISA-L builds with nmake, which needs the compiler's environment a Developer PowerShell sets.
      - run: ./tools/msvc-env.ps1
      - name: just dist
        run: |
          $env:PATH = "C:\Program Files\NASM;$env:PATH"
          just dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            smeltr-windows.zip

  # Nothing is published until every archive is built: the image and the Release go out together.
  publish:
    needs: [linux, windows]
    # A pre-release run without Windows skips that job, and a skipped need would skip this one too.
    if: ${{ !cancelled() && needs.linux.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.windows.result) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      # Keyless signing: Sigstore certifies this workflow's OIDC identity, so there is no key to keep.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just
      - name: List the Windows binary's crates as an SBOM, and their known vulnerabilities
        if: needs.windows.result == 'success'
        run: |
          # A zip keeps no Unix mode, and Trivy reads only executable files.
          unzip -q -d smeltr-windows windows/smeltr-windows.zip && chmod +x smeltr-windows/smeltr.exe
          just --justfile repo/justfile --working-directory . sbom smeltr-windows
          just --justfile repo/justfile --working-directory . cves smeltr-windows
          mv sbom/sbom.cdx.json windows/smeltr-sbom-windows.cdx.json && mv cves/report.txt windows/smeltr-cves-windows.txt
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image to ghcr.io
        id: push
        run: |
          name=${GITHUB_REF_NAME#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          # Each architecture's image goes up under a tag of its own; every release tag names the index of both.
          for each in amd64: arm64:-arm64; do
            arch=${each%%:*} suffix=${each#*:}
            docker load -i "linux$suffix/smeltr-image-linux$suffix.tar.gz"
            docker tag "smeltr:$name" "$image:$name-$arch"
            docker push "$image:$name-$arch"
          done
          # `1.2`, `1` and `latest` move only to the newest release they cover on main or a release branch, so a
          # patch to a version that has been passed leaves the newer release's tags where they are, and a stray tag
          # moves none of them.
          newest() {
            for branch in $(git -C repo branch -r --format='%(refname:short)' --list origin/main 'origin/release/*'); do
              git -C repo tag --list "$1" --merged "$branch"
            done | grep -v -- - | sort -rV | head -1
          }
          tags="$name"
          case "$name" in
            *-*) ;;
            *)
              if [ "$(newest "v${name%.*}.*")" = "$GITHUB_REF_NAME" ]; then tags="$tags ${name%.*}"; fi
              if [ "$(newest "v${name%%.*}.*")" = "$GITHUB_REF_NAME" ]; then tags="$tags ${name%%.*}"; fi
              if [ "$(newest 'v[0-9]*')" = "$GITHUB_REF_NAME" ]; then tags="$tags latest"; else older=true; fi
              ;;
          esac
          refs=()
          for t in $tags; do refs+=(-t "$image:$t"); done
          docker buildx imagetools create "${refs[@]}" "$image:$name-amd64" "$image:$name-arm64"
          # Every tag names one index, so signing its digest covers them all.
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image:$name")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "older=${older:-}" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the image and attest its SBOMs
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          INDEX: ${{ steps.push.outputs.digest }}
        run: |
          # `--recursive` signs the index and each architecture's image in it. The SBOMs go on the index, the digest a
          # pull records, so the check the install page gives finds them.
          cosign sign --yes --recursive "$IMAGE@$INDEX"
          cosign attest --yes --type cyclonedx --predicate linux/smeltr-sbom-linux.cdx.json "$IMAGE@$INDEX"
          cosign attest --yes --type cyclonedx --predicate linux-arm64/smeltr-sbom-linux-arm64.cdx.json "$IMAGE@$INDEX"
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS: ${{ needs.windows.result }}
          OLDER: ${{ steps.push.outputs.older }}
        run: |
          # The release lists what most people download; the image archive and the reports go in one zip beside them.
          zip -j smeltr-extras.zip linux/smeltr-image-linux.tar.gz linux/smeltr-sbom-linux.cdx.json \
            linux/smeltr-stig-linux.html linux/smeltr-cves-linux.txt \
            linux-arm64/smeltr-image-linux-arm64.tar.gz linux-arm64/smeltr-sbom-linux-arm64.cdx.json \
            linux-arm64/smeltr-stig-linux-arm64.html linux-arm64/smeltr-cves-linux-arm64.txt
          if [ "$WINDOWS" = success ]; then zip -j smeltr-extras.zip windows/smeltr-sbom-windows.cdx.json windows/smeltr-cves-windows.txt; fi
          # A release's notes are its page on smeltr.sh, as Markdown; a pre-release has none.
          prerelease= notes= latest=
          case "$GITHUB_REF_NAME" in
            *-*) prerelease='--prerelease --draft' ;;
            *) notes=$(node repo/website/scripts/release-notes.js "${GITHUB_REF_NAME#v}") ;;
          esac
          assets=(linux/smeltr-linux.tar.gz linux-arm64/smeltr-linux-arm64.tar.gz)
          if [ "$WINDOWS" = success ]; then assets+=(windows/smeltr-windows.zip); fi
          # A patch to an older line is not the release GitHub shows as latest.
          if [ -n "$OLDER" ]; then latest=--latest=false; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease $latest \
            --title "${GITHUB_REF_NAME#v}" --notes "$notes" \
            "${assets[@]}" smeltr-extras.zip
