# What `cargo about` may accept when it resolves each crate's license. The
# same set as `deny.toml`'s allow list: one place decides what is permitted,
# this one decides what gets reproduced.
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The platforms a release is built for. A crate that only ever compiles on
# one of them still ships on that one, so both are resolved.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Smeltr itself is under `LICENSE`, not a third party's notice.
private = { ignore = true }

# Build dependencies do not ship in the binary; everything else does.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# AWS-LC's C sources each carry a license header, and cargo-about would reproduce a share of those files whole,
# a different share on each machine. Its one LICENSE holds every license the crate is under.
[aws-lc-fips-sys.clarify]
license = "ISC AND (Apache-2.0 OR ISC) AND OpenSSL"

[[aws-lc-fips-sys.clarify.files]]
path = "LICENSE"
license = "ISC AND (Apache-2.0 OR ISC) AND OpenSSL"
checksum = "5df09a98cac8843239a4d8f48a85089de6b68ed106612afcd2aa37a6453c2e3f"
