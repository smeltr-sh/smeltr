'@timestamp':
  dashed_name: timestamp
  description: 'Date/time when the event originated.

    This is the date/time extracted from the event, typically representing when the
    event was generated by the source.

    If the event source has no original timestamp, this value is typically populated
    by the first time the event was received by the pipeline.

    Required field for all events.'
  example: '2016-05-23T08:05:34.853Z'
  flat_name: '@timestamp'
  level: core
  name: '@timestamp'
  normalize: []
  otel:
  - otlp_field: time_unix_nano
    relation: otlp
    stability: stable
  - otlp_field: observed_time_unix_nano
    relation: otlp
    stability: stable
  - note: 'On logs, events and metrics, `time_unix_nano` defines the time of the event.
      For logs, `observed_time_unix_nano` defines the time when the event was observed
      by the collection system. On spans, `start_time_unix_nano` represents the start
      time of the span.

      '
    otlp_field: start_time_unix_nano
    relation: otlp
    stability: stable
  required: true
  short: Date/time when the event originated.
  type: date
agent.id:
  dashed_name: agent-id
  description: 'Unique identifier of this agent (if one exists).

    Example: For Beats this would be beat.id.'
  example: 8a4f500d
  flat_name: agent.id
  ignore_above: 1024
  level: core
  name: id
  normalize: []
  short: Unique identifier of this agent.
  type: keyword
client.ip:
  dashed_name: client-ip
  description: IP address of the client (IPv4 or IPv6).
  flat_name: client.ip
  level: core
  name: ip
  normalize: []
  short: IP address of the client.
  type: ip
ecs.version:
  dashed_name: ecs-version
  description: 'ECS version this event conforms to. `ecs.version` is a required field
    and must exist in all events.

    When querying across multiple indices -- which may conform to slightly different
    ECS versions -- this field lets integrations adjust to the schema version of the
    events.'
  example: 1.0.0
  flat_name: ecs.version
  ignore_above: 1024
  level: core
  name: version
  normalize: []
  otel:
  - relation: na
  required: true
  short: ECS version this event conforms to.
  type: keyword
gen_ai.input.messages:
  beta: This field is beta and subject to change.
  dashed_name: gen-ai-input-messages
  description: The chat history provided to the model as an input.
  example: "{\n  \"role\": \"user\",\n  \"parts\": [\n    {\n      \"type\": \"text\"\
    ,\n      \"content\": \"Weather in Paris?\"\n    }\n  ]\n}, {\n  \"role\": \"\
    assistant\",\n  \"parts\": [\n    {\n      \"type\": \"tool_call\",\n      \"\
    id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n      \"name\": \"get_weather\",\n \
    \     \"arguments\": {\n        \"location\": \"Paris\"\n      }\n    }\n  ]\n\
    }, {\n  \"role\": \"tool\",\n  \"parts\": [\n    {\n      \"type\": \"tool_call_response\"\
    ,\n      \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n      \"result\": \"rainy,\
    \ 57°F\"\n    }\n  ]\n}"
  flat_name: gen_ai.input.messages
  level: extended
  name: input.messages
  normalize: []
  otel:
  - relation: match
    stability: development
  short: The chat history provided to the model as an input.
  type: flattened
labels:
  dashed_name: labels
  description: 'Custom key/value pairs.

    Can be used to add meta information to events. Should not contain nested objects.
    All values are stored as keyword.

    Example: `docker` and `k8s` labels.'
  example: '{"application": "foo-bar", "env": "production"}'
  flat_name: labels
  level: core
  name: labels
  normalize: []
  object_type: keyword
  otel:
  - attribute: k8s.pod.label
    relation: related
    stability: stable
  - attribute: container.label
    relation: related
    stability: development
  short: Custom key/value pairs.
  type: object
message:
  dashed_name: message
  description: 'For log events the message field contains the log message, optimized
    for viewing in a log viewer.

    For structured logs without an original message field, other fields can be concatenated
    to form a human-readable summary of the event.

    If multiple messages exist, they can be combined into one message.'
  example: Hello World
  flat_name: message
  level: core
  name: message
  normalize: []
  otel:
  - note: The `body` in OTLP is of type `Any` and can be either an unstructured log
      message or a structured event.
    otlp_field: body
    relation: otlp
    stability: stable
  short: Log message optimized for viewing in a log viewer.
  type: match_only_text
tags:
  dashed_name: tags
  description: List of keywords used to tag each event.
  example: '["production", "env2"]'
  flat_name: tags
  ignore_above: 1024
  level: core
  name: tags
  normalize:
  - array
  short: List of keywords used to tag each event.
  synthetic_source_keep: none
  type: keyword
