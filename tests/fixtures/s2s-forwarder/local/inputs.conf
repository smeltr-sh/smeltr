# What the forwarder in tests/live/compose.live.yaml reads: the files s2s_live_tests writes under the repo's target/s2s-forwarder,
# which the forwarder sees at /smeltr/target/s2s-forwarder.

[monitor:///smeltr/target/s2s-forwarder/access-*.log]
sourcetype = access_combined
index = main
host = webhost01

[monitor:///smeltr/target/s2s-forwarder/multi-*.log]
sourcetype = smeltr:multiline
source = smeltr_multiline
