# One forwarder, three receivers: a forwarder clones what it reads to every group in defaultGroup. s2s_live_tests
# opens a receiver on each port, taking this token.
#
# A group whose queue is full holds the others back rather than dropping what it was to be sent: by default a forwarder
# drops a group's clones after 5 seconds, and the receivers are down until the test opens them.
#
# The acked groups' queues are small, so their ack windows fill while the forwarder sends its backlog: a forwarder
# waiting for acks sends heartbeats, which a receiver must not take as a file's bytes.

[tcpout]
defaultGroup = plain, acked, compressed
dropClonedEventsOnQueueFull = -1
# Only what the test writes. The forwarder's own indexes are not the test's to control: on its second start it logs its
# whole configuration to _configtracker, in lines far longer than the acked groups' windows.
forwardedindex.3.blacklist = _.*
# The receivers are down until the test opens them. A forwarder backs off a receiver it cannot reach for one to ten
# times autoLBFrequency: each group has one receiver, so a short one only shortens the wait.
autoLBFrequency = 1

[tcpout:plain]
server = host.docker.internal:19981
token = 5b6f0c2e-8a41-4d7e-9c3b-1f2a4e6d8c90

[tcpout:acked]
server = host.docker.internal:19982
token = 5b6f0c2e-8a41-4d7e-9c3b-1f2a4e6d8c90
useACK = true
maxQueueSize = 100KB

[tcpout:compressed]
server = host.docker.internal:19983
token = 5b6f0c2e-8a41-4d7e-9c3b-1f2a4e6d8c90
useACK = true
maxQueueSize = 100KB
compressed = true
