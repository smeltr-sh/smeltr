# tests/reference/suricata.rs's mapping to ECS, and its enrichment. The event is read under `[e]`, so its objects
# and the ECS objects of the same names stay apart; what the mapping does not read goes under `suricata.eve` at the
# end.
filter {
  json {
    source => "message"
    target => "e"
  }
  # What the inputs add.
  mutate {
    remove_field => ["message", "@version", "event", "host", "http", "url", "user_agent"]
  }
  # The date filter keeps milliseconds; Suricata writes microseconds.
  ruby {
    code => "
      event.set('@timestamp', LogStash::Timestamp.parse_iso8601(event.get('[e][timestamp]')))
      if event.get('[e][event_type]') == 'flow'
        ['start', 'end'].each do |at|
          t = event.get('[e][flow][' + at + ']')
          event.set('[event][' + at + ']', LogStash::Timestamp.parse_iso8601(t)) if t
        end
      end
    "
  }
  mutate {
    add_field => {
      "[event][module]" => "suricata"
      "[event][dataset]" => "suricata.eve"
    }
    copy => {
      "[e][src_ip]" => "[source][ip]"
      "[e][src_port]" => "[source][port]"
      "[e][dest_ip]" => "[destination][ip]"
      "[e][dest_port]" => "[destination][port]"
      "[e][proto]" => "[network][transport]"
      "[e][community_id]" => "[network][community_id]"
      "[e][in_iface]" => "[observer][ingress][interface][name]"
      "[e][host]" => "[observer][hostname]"
    }
  }
  # A mutate lowercases before it copies.
  mutate {
    lowercase => ["[network][transport]"]
  }
  if [e][event_type] == "alert" {
    mutate {
      add_field => {
        "[event][kind]" => "alert"
        "[event][category]" => "intrusion_detection"
      }
    }
  } else {
    mutate {
      add_field => {
        "[event][kind]" => "event"
        "[event][category]" => "network"
      }
    }
  }
  if [e][app_proto] != "failed" {
    mutate {
      copy => { "[e][app_proto]" => "[network][protocol]" }
    }
  }
  # The name the far end goes by, whichever protocol said it.
  if [e][http][hostname] {
    mutate {
      copy => { "[e][http][hostname]" => "[destination][domain]" }
    }
  } else if [e][tls][sni] {
    mutate {
      copy => { "[e][tls][sni]" => "[destination][domain]" }
    }
  } else if [e][dns][rrname] {
    mutate {
      copy => { "[e][dns][rrname]" => "[destination][domain]" }
    }
  }

  if [e][event_type] in ["alert", "flow"] {
    mutate {
      copy => {
        "[e][flow][pkts_toserver]" => "[source][packets]"
        "[e][flow][bytes_toserver]" => "[source][bytes]"
        "[e][flow][pkts_toclient]" => "[destination][packets]"
        "[e][flow][bytes_toclient]" => "[destination][bytes]"
      }
    }
    ruby {
      code => "
        [['packets', 'pkts'], ['bytes', 'bytes']].each do |to, from|
          a = event.get('[e][flow][' + from + '_toserver]')
          b = event.get('[e][flow][' + from + '_toclient]')
          event.set('[network][' + to + ']', a + b) if a.is_a?(Integer) && b.is_a?(Integer)
        end
      "
    }
  }
  if [e][event_type] in ["http", "fileinfo"] {
    mutate {
      copy => {
        "[e][http][hostname]" => "[url][domain]"
        "[e][http][url]" => "[url][original]"
        "[e][http][http_method]" => "[http][request][method]"
        "[e][http][status]" => "[http][response][status_code]"
        "[e][http][length]" => "[http][response][body][bytes]"
        "[e][http][http_user_agent]" => "[user_agent][original]"
      }
    }
    mutate {
      copy => { "[url][original]" => "[url][path]" }
    }
    mutate {
      gsub => ["[url][path]", "\?.*", ""]
    }
  }
  if [e][event_type] == "alert" {
    mutate {
      copy => {
        "[e][alert][signature_id]" => "[rule][id]"
        "[e][alert][signature]" => "[rule][name]"
        "[e][alert][category]" => "[rule][category]"
        "[e][alert][severity]" => "[event][severity]"
        "[e][alert][action]" => "[event][action]"
      }
    }
    if [e][alert][action] == "blocked" {
      mutate {
        add_field => { "[event][outcome]" => "failure" }
      }
    } else if [e][alert][action] {
      mutate {
        add_field => { "[event][outcome]" => "success" }
      }
    }
  } else if [e][event_type] == "dns" {
    mutate {
      copy => {
        "[e][dns][type]" => "[dns][type]"
        "[e][dns][id]" => "[dns][id]"
        "[e][dns][rrname]" => "[dns][question][name]"
        "[e][dns][rrtype]" => "[dns][question][type]"
        "[e][dns][rcode]" => "[dns][response_code]"
      }
    }
  } else if [e][event_type] == "tls" {
    mutate {
      add_field => { "[tls][version_protocol]" => "tls" }
      copy => {
        "[e][tls][sni]" => "[tls][client][server_name]"
        "[e][tls][version]" => "[tls][version]"
        "[e][tls][subject]" => "[tls][server][subject]"
        "[e][tls][issuerdn]" => "[tls][server][issuer]"
        "[e][tls][ja3][hash]" => "[tls][client][ja3]"
      }
    }
    # `TLS 1.3`'s version.
    mutate {
      gsub => ["[tls][version]", "^[^ ]* ([^ ]*).*$", "\1"]
    }
  } else if [e][event_type] == "fileinfo" {
    mutate {
      copy => {
        "[e][fileinfo][filename]" => "[file][name]"
        "[e][fileinfo][size]" => "[file][size]"
        "[e][fileinfo][md5]" => "[file][hash][md5]"
        "[e][fileinfo][sha1]" => "[file][hash][sha1]"
        "[e][fileinfo][sha256]" => "[file][hash][sha256]"
      }
    }
    # `/download/<name>`'s name.
    mutate {
      gsub => ["[file][name]", "^[^/]*/[^/]*/([^/]*).*$", "\1"]
    }
  } else if [e][event_type] == "smtp" {
    mutate {
      copy => {
        "[e][smtp][mail_from]" => "[email][from][address]"
        "[e][email][subject]" => "[email][subject]"
        "[e][smtp][helo]" => "[source][domain]"
      }
    }
    # SMTP's `<address>`, without the brackets.
    mutate {
      gsub => ["[email][from][address]", "^.(.*).$", "\1"]
    }
  }

  # Both ends: GeoIP, and the company's network.
  geoip {
    source => "[source][ip]"
    target => "source"
    database => "/etc/engine/lookups/city.mmdb"
    fields => ["COUNTRY_CODE2", "CITY_NAME", "LOCATION"]
    tag_on_failure => []
  }
  geoip {
    source => "[destination][ip]"
    target => "destination"
    database => "/etc/engine/lookups/city.mmdb"
    fields => ["COUNTRY_CODE2", "CITY_NAME", "LOCATION"]
    tag_on_failure => []
  }
  # The geoip filter reads only MaxMind's own database types, and translate takes a two-column CSV and matches its
  # regexes leftmost rather than first, so the company's three tables are read here: the networks with the MaxMind
  # reader the geoip filter ships, the domains and the patterns from their CSVs.
  ruby {
    init => "
      require 'csv'
      # An empty cell is an empty string, as the other engines read one.
      cells = { headers: true, nil_value: '' }
      Dir.glob(LogStash::Environment::LOGSTASH_HOME + '/vendor/**/maxmind-db-*.jar').each { |jar| require jar }
      @networks = Java::ComMaxmindDb::Reader.new(java.io.File.new('/etc/engine/lookups/networks.mmdb'))
      @domains = {}
      CSV.foreach('/etc/engine/lookups/domains.csv', **cells) { |r| @domains[r['domain']] = [r['category'], r['owner']] }
      @patterns = CSV.foreach('/etc/engine/lookups/domain-patterns.csv', **cells).map do |r|
        [Regexp.new(r['pattern']), r['verdict'], r['reason']]
      end
    "
    code => "
      ['source', 'destination'].each do |side|
        ip = event.get('[' + side + '][ip]')
        next unless ip
        net = @networks.get(java.net.InetAddress.getByName(ip), java.util.Map.java_class)
        next unless net
        event.set('[' + side + '][site]', net['site'])
        event.set('[' + side + '][network_tier]', net['tier'])
        event.set('[' + side + '][business_unit]', net['business_unit'])
      end
      domain = event.get('[destination][domain]')
      if domain.is_a?(String)
        category, owner = @domains[domain]
        if category
          event.set('[destination][domain_category]', category)
          event.set('[destination][domain_owner]', owner)
        end
        _, verdict, reason = @patterns.find { |p| p[0].match?(domain) }
        if verdict
          event.set('[destination][domain_verdict]', verdict)
          event.set('[destination][domain_reason]', reason)
        end
      end
    "
  }

  # What Suricata sent, under `suricata.eve`; what the mapping reads from the top is left out.
  mutate {
    rename => {
      "[e][alert]" => "[suricata][eve][alert]"
      "[e][flow]" => "[suricata][eve][flow]"
      "[e][tcp]" => "[suricata][eve][tcp]"
      "[e][dns]" => "[suricata][eve][dns]"
      "[e][http]" => "[suricata][eve][http]"
      "[e][tls]" => "[suricata][eve][tls]"
      "[e][fileinfo]" => "[suricata][eve][fileinfo]"
      "[e][smtp]" => "[suricata][eve][smtp]"
      "[e][email]" => "[suricata][eve][email]"
      "[e][vlan]" => "[suricata][eve][vlan]"
      "[e][tx_id]" => "[suricata][eve][tx_id]"
      "[e][direction]" => "[suricata][eve][direction]"
      "[e][payload]" => "[suricata][eve][payload]"
      "[e][payload_printable]" => "[suricata][eve][payload_printable]"
      "[e][stream]" => "[suricata][eve][stream]"
      "[e][host]" => "[suricata][eve][host]"
      "[e][event_type]" => "[suricata][eve][event_type]"
      "[e][flow_id]" => "[suricata][eve][flow_id]"
    }
  }
  mutate {
    remove_field => ["e"]
  }
}
