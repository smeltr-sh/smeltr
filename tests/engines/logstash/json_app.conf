# tests/reference/json_app.rs's mapping to ECS.
filter {
  json {
    source => "message"
    remove_field => ["message"]
  }
  if [level] == "debug" {
    drop {}
  }
  date {
    match => ["ts", "ISO8601"]
    remove_field => ["ts"]
  }
  ruby {
    code => "event.set('[event][duration]', (event.remove('latency_ms').to_f * 1000000).round)"
  }
  mutate {
    rename => {
      "level" => "[log][level]"
      "logger" => "[log][logger]"
      "msg" => "message"
      "attempt" => "[labels][attempt]"
      "[user][tier]" => "[labels][tier]"
      "order_id" => "[labels][order_id]"
      "[error][stack]" => "[error][stack_trace]"
    }
    # The app's fields the mapping does not keep, and what the inputs add.
    remove_field => ["trace_id", "span_id", "http", "@version", "url", "user_agent", "host", "[event][original]"]
  }
}
